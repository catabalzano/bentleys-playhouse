# Deploys the Pawsome Pooches submissions service (worker/) to Cloudflare.
# Needs one repository secret: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token). The account ID is in worker/wrangler.toml.
name: Deploy submissions service
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-submissions-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check Cloudflare is connected
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || grep -q REPLACE_WITH_KV_ID worker/wrangler.toml; then echo "ready=no" >> "$GITHUB_OUTPUT"; echo "Cloudflare not set up yet, skipping."; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm install --no-audit --no-fund && npx wrangler deploy
