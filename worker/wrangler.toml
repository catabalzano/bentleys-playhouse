name = "bentleys-playhouse-submissions"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GITHUB_REPO = "catabalzano/bentleys-playhouse"
GITHUB_BRANCH = "main"
SITE_URL = "https://bentleysplayhouse.org"
ALLOWED_ORIGINS = "https://bentleysplayhouse.org,https://www.bentleysplayhouse.org,http://localhost:8765"
MAX_PER_HOUR = "6"
# TURNSTILE_SECRET is set as a secret (wrangler secret put TURNSTILE_SECRET), never here.

[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "REPLACE_WITH_KV_ID"
