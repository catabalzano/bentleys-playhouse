<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pawsome Pooches · Submissions</title>
<link rel="icon" href="../../assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&family=Fredoka:wght@500..700&display=swap">
<style>
:root{--blue:#5271FF;--deep:#2F45C8;--violet:#7A45E6;--orange:#FF914D;--gold:#FFBD59;--ink:#1F1D2B;--muted:#5c5a72;--line:#E3E1EE;--cream:#F3F5FF;--green:#1B6E45;--red:#B3261E}
*{box-sizing:border-box}body{margin:0;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--cream)}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0}
a{color:var(--deep)}
.top{background:linear-gradient(90deg,var(--deep),var(--violet));color:#fff;padding:14px 16px}
.top__in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.top h1{font-size:22px}.top a{color:#fff;font-weight:700}.top .sp{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tabs button{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800}
.tabs button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(47,69,200,.1);margin-bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px}
@media(max-width:820px){.card{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#EEE9FB;cursor:pointer;border:3px solid transparent}
.photos figure.main{border-color:var(--orange);grid-column:span 3;aspect-ratio:4/3}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:6px;bottom:6px;background:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:12px;font-weight:800;padding:.3em .75em;border-radius:999px;background:#F1ECFF;color:#4B2A9E}
.chip.pending{background:#FFF1E6;color:#9A4A12}.chip.approved{background:#E3F4EA;color:var(--green)}.chip.rejected{background:#FDE7E5;color:var(--red)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0;font-size:14.5px}dt{font-weight:800;color:var(--muted)}dd{margin:0}
.box{background:#FFF8EC;border-radius:16px;padding:12px 14px;margin:12px 0}
.box h3{font-size:16px;margin-bottom:6px}
label.f{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
textarea{min-height:130px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:999px;font-weight:800}
.btn.go{background:var(--orange);box-shadow:0 4px 0 #C9601F}.btn.go:hover{transform:translateY(-1px)}
.btn.no{border:2px solid var(--red);color:var(--red)}.btn.ghost{border:2px solid var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.msg{font-weight:800}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.signin{max-width:560px;margin:40px auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 28px rgba(47,69,200,.1)}
.signin ol{padding-left:1.2em;line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header class="top"><div class="top__in"><h1>🐾 Pawsome Pooches submissions</h1><span class="sp"></span><a href="../">Back to admin</a><a href="../../pawsome-pooches/">View Pawsome Pooches</a><a href="#" id="signout" hidden>Sign out</a></div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var API = (window.BP_SUBMIT || '').replace(/\/$/, '');
  var app = document.getElementById('app');
  var TOKEN_KEY = 'bp.ghToken';
  var state = { list: [], tab: 'pending', urls: {} };
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function token() {
    try { var t = localStorage.getItem(TOKEN_KEY); if (t) return t; } catch (e) {}
    try { var u = JSON.parse(localStorage.getItem('sveltia-cms.user') || 'null'); if (u && u.token) return u.token; } catch (e) {}
    return '';
  }
  function api(path, opts) {
    opts = opts || {}; opts.headers = Object.assign({ Authorization: 'Bearer ' + token() }, opts.headers || {});
    return fetch(API + path, opts).then(function (r) {
      if (r.headers.get('Content-Type') && r.headers.get('Content-Type').indexOf('json') > -1) return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Error'); e.status = r.status; throw e; } return j; });
      if (!r.ok) throw new Error('Error ' + r.status); return r.blob();
    });
  }
  function signin(msg) {
    document.getElementById('signout').hidden = true;
    app.innerHTML = '<div class="signin"><h2>Sign in</h2>' + (msg ? '<p class="msg err">' + esc(msg) + '</p>' : '') +
      '<p>Use the same GitHub token you use to sign in to the admin.</p><ol><li>If you don\'t have it handy, make one at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li><li>Repository access: <b>bentleys-playhouse</b> only. Permissions → <b>Contents: Read and write</b>.</li><li>Paste it below. It stays in this browser only.</li></ol>' +
      '<label class="f" for="tok">GitHub token</label><input type="text" id="tok" autocomplete="off" spellcheck="false"><div class="row"><button class="btn go" id="tokgo">Sign in</button></div></div>';
    document.getElementById('tokgo').onclick = function () { var v = document.getElementById('tok').value.trim(); if (!v) return; try { localStorage.setItem(TOKEN_KEY, v); } catch (e) {} load(); };
  }
  function load() {
    if (!API) { app.innerHTML = '<p class="empty">The submissions service isn\'t connected yet (content/site.json → pawsome.submitEndpoint).</p>'; return; }
    if (!token()) return signin();
    app.innerHTML = '<p class="empty">Loading…</p>';
    api('/admin/list').then(function (j) { state.list = j.submissions || []; document.getElementById('signout').hidden = false; render(); })
      .catch(function (e) { if (e.status === 401 || e.status === 403) { try { localStorage.removeItem(TOKEN_KEY); } catch (x) {} signin(e.message); } else app.innerHTML = '<p class="empty msg err">' + esc(e.message) + '</p>'; });
  }
  document.getElementById('signout').onclick = function (e) { e.preventDefault(); try { localStorage.removeItem(TOKEN_KEY); } catch (x) {} signin(); };

  var LOC = { 'mdas-doral': 'MDAS · Doral', 'mdas-medley': 'MDAS · Medley', broward: 'Broward shelter', rescue: 'Rescue', foster: 'In foster', family: 'Family rehoming', other: 'Other' };
  var YN = { yes: 'Yes', no: 'No', some: 'Some / depends', unknown: 'Not sure' };
  function render() {
    var c = { pending: 0, approved: 0, rejected: 0 }; state.list.forEach(function (s) { c[s.status] = (c[s.status] || 0) + 1; });
    var items = state.list.filter(function (s) { return s.status === state.tab; });
    app.innerHTML = '<div class="tabs" role="group" aria-label="Show">' + ['pending', 'approved', 'rejected'].map(function (t) { return '<button data-tab="' + t + '" aria-pressed="' + (state.tab === t) + '">' + (t === 'pending' ? 'To review' : t[0].toUpperCase() + t.slice(1)) + ' (' + c[t] + ')</button>'; }).join('') + '<button data-reload>↻ Refresh</button></div>' +
      (items.length ? items.map(card).join('') : '<p class="empty">' + (state.tab === 'pending' ? 'No new submissions. 🐶' : 'Nothing here yet.') + '</p>');
    app.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { state.tab = b.dataset.tab; render(); }; });
    app.querySelector('[data-reload]').onclick = load;
    items.forEach(wire);
  }
  function card(s) {
    var d = s.dog, p = s.submitter, when = new Date(s.createdAt).toLocaleString();
    var photos = ''; for (var i = 0; i < s.photoCount; i++) photos += '<figure data-i="' + i + '"' + (i === 0 ? ' class="main"' : '') + '><img alt="Photo ' + (i + 1) + '" data-ph="' + s.id + ':' + i + '"><figcaption>' + (i === 0 ? 'Main' : i + 1) + '</figcaption></figure>';
    var social = p.social.replace(/^@/, '');
    return '<article class="card" id="s-' + s.id + '"><div><div class="photos" data-photos>' + (photos || '<p class="hint">Photos removed.</p>') + '</div>' + (s.status === 'pending' && s.photoCount > 1 ? '<p class="hint">Tap a photo to make it the main one.</p>' : '') + '</div><div>' +
      '<div class="meta"><span class="chip ' + s.status + '">' + s.status + '</span><span class="chip">' + esc(LOC[d.locationType] || d.locationType) + '</span><span class="chip">' + esc(d.needs === 'both' ? 'Adopt or foster' : d.needs === 'foster' ? 'Needs foster' : 'Needs adopter') + '</span></div>' +
      '<h2>' + esc(d.name) + '</h2><p class="hint">Submitted ' + esc(when) + '</p>' +
      '<dl><dt>Breed</dt><dd>' + esc(d.breed) + '</dd><dt>Age</dt><dd>' + esc(d.age) + '</dd><dt>Sex</dt><dd>' + esc(d.sex) + '</dd>' +
      '<dt>Spayed/neutered</dt><dd>' + YN[d.fixed] + '</dd><dt>Vaccines</dt><dd>' + YN[d.vaccinated] + '</dd><dt>Microchip</dt><dd>' + YN[d.microchipped] + '</dd><dt>Heartworm neg.</dt><dd>' + YN[d.heartworm] + '</dd>' +
      '<dt>Good with</dt><dd>Dogs: ' + YN[d.goodWithDogs] + ' · Cats: ' + YN[d.goodWithCats] + ' · Kids: ' + YN[d.goodWithKids] + '</dd>' +
      '<dt>Where</dt><dd>' + esc([d.orgName, LOC[d.locationType], d.city].filter(Boolean).join(', ')) + '</dd>' + (d.animalId ? '<dt>Shelter ID</dt><dd>' + esc(d.animalId) + '</dd>' : '') + '</dl>' +
      '<div class="box"><h3>Submitted by (private)</h3><dl><dt>Name</dt><dd>' + esc(p.firstName + ' ' + p.lastName) + '</dd><dt>Social</dt><dd><a href="https://www.instagram.com/' + encodeURIComponent(social) + '/" target="_blank" rel="noopener">@' + esc(social) + '</a></dd><dt>Phone</dt><dd><a href="tel:' + esc(p.phone.replace(/[^\d+]/g, '')) + '">' + esc(p.phone) + '</a></dd><dt>Email</dt><dd><a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a></dd></dl></div>' +
      (s.status === 'pending' ?
        '<label class="f" for="n-' + s.id + '">Name on the site</label><input type="text" id="n-' + s.id + '" value="' + esc(d.name) + '">' +
        '<label class="f" for="t-' + s.id + '">Tagline <span class="hint">(one short line under the name)</span></label><input type="text" id="t-' + s.id + '" maxlength="220" placeholder="e.g. A goofy, gentle pit mix who loves car rides">' +
        '<label class="f" for="b-' + s.id + '">Story <span class="hint">(edit freely; this is what people read)</span></label><textarea id="b-' + s.id + '">' + esc(d.about) + '</textarea>' +
        '<label class="f"><input type="checkbox" id="u-' + s.id + '"> Mark as urgent</label>' +
        '<div class="row"><button class="btn go" data-approve>✓ Approve &amp; publish</button><button class="btn no" data-reject>Reject</button><span class="msg" data-msg role="status"></span></div>'
        : s.status === 'approved' ? '<p class="msg ok">Published' + (s.published ? ': <a href="' + esc(s.published.url) + '" target="_blank" rel="noopener">' + esc(s.published.url) + '</a>' : '') + '</p><p class="hint">Edit or mark adopted any time in the admin under Pawsome Pooches.</p>'
        : '<div class="row"><button class="btn ghost" data-delete>Delete for good</button><span class="msg" data-msg role="status"></span></div>') +
      '</div></article>';
  }
  function wire(s) {
    var el = document.getElementById('s-' + s.id); if (!el) return;
    el.querySelectorAll('img[data-ph]').forEach(function (img) {
      var k = img.dataset.ph; if (state.urls[k]) { img.src = state.urls[k]; return; }
      api('/admin/photo/' + k.replace(':', '/')).then(function (b) { state.urls[k] = URL.createObjectURL(b); img.src = state.urls[k]; }).catch(function () {});
    });
    var order = []; for (var i = 0; i < s.photoCount; i++) order.push(i);
    var box = el.querySelector('[data-photos]');
    if (s.status === 'pending') el.querySelectorAll('figure').forEach(function (f) {
      f.onclick = function () { var i = +f.dataset.i; order = [i].concat(order.filter(function (x) { return x !== i; })); order.forEach(function (x, n) { var fig = box.querySelector('figure[data-i="' + x + '"]'); box.appendChild(fig); fig.classList.toggle('main', n === 0); fig.querySelector('figcaption').textContent = n ? n + 1 : 'Main'; }); };
    });
    var msg = el.querySelector('[data-msg]');
    var ap = el.querySelector('[data-approve]'), rj = el.querySelector('[data-reject]'), dl = el.querySelector('[data-delete]');
    if (ap) ap.onclick = function () {
      ap.disabled = rj.disabled = true; msg.className = 'msg'; msg.textContent = 'Publishing…';
      api('/admin/approve/' + s.id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: el.querySelector('#n-' + s.id).value, tagline: el.querySelector('#t-' + s.id).value, story: el.querySelector('#b-' + s.id).value, urgent: el.querySelector('#u-' + s.id).checked, photoOrder: order }) })
        .then(function (j) { s.status = 'approved'; s.published = j; msg.className = 'msg ok'; msg.innerHTML = 'Published! It will be live in about 2 minutes: <a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.url) + '</a>'; })
        .catch(function (e) { msg.className = 'msg err'; msg.textContent = e.message; ap.disabled = rj.disabled = false; });
    };
    if (rj) rj.onclick = function () {
      if (rj.dataset.sure !== '1') { rj.dataset.sure = '1'; rj.textContent = 'Tap again to reject'; return; }
      rj.disabled = ap.disabled = true;
      api('/admin/reject/' + s.id, { method: 'POST' }).then(function () { s.status = 'rejected'; s.photoCount = 0; render(); }).catch(function (e) { msg.className = 'msg err'; msg.textContent = e.message; rj.disabled = ap.disabled = false; });
    };
    if (dl) dl.onclick = function () {
      if (dl.dataset.sure !== '1') { dl.dataset.sure = '1'; dl.textContent = 'Tap again to delete'; return; }
      api('/admin/delete/' + s.id, { method: 'POST' }).then(function () { state.list = state.list.filter(function (x) { return x !== s; }); render(); }).catch(function (e) { msg.className = 'msg err'; msg.textContent = e.message; });
    };
  }
  load();
})();
</script>
</body>
</html>
