# Admin (Sveltia CMS). Generated by tools/make-admin-config.py; edit that file, not this one.
backend:
  name: github
  repo: catabalzano/bentleys-playhouse
  branch: main
  commit_messages:
    create: 'Admin: add {{collection}} "{{slug}}"'
    update: 'Admin: update {{collection}} "{{slug}}"'
    delete: 'Admin: delete {{collection}} "{{slug}}"'
    uploadMedia: 'Admin: upload "{{path}}"'
    deleteMedia: 'Admin: delete "{{path}}"'
site_url: https://bentleysplayhouse.org
display_url: https://bentleysplayhouse.org
logo_url: /assets/img/logo-main.png
media_folder: src/assets/uploads
public_folder: /assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 20000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: pawsome
  label: Pawsome Pooches
  label_singular: Pawsome Pooch
  description: Community dogs featured each week. To mark a pup as adopted, open it, set Status to "Adopted" and add the adoption date. Adopted pups move to "Happy tails".
  folder: content/pawsome
  create: true
  delete: true
  slug: '{{slug}}'
  identifier_field: name
  summary: '{{name}} · {{status}} · week of {{featuredWeek}}'
  media_folder: /src/assets/img/pawsome
  public_folder: /assets/img/pawsome
  sortable_fields:
  - featuredWeek
  - name
  - status
  view_filters:
  - label: Available
    field: status
    pattern: available
  - label: Pending
    field: status
    pattern: pending
  - label: Adopted
    field: status
    pattern: adopted
  editor:
    preview: false
  fields:
  - label: Name
    name: name
    widget: string
    required: true
    hint: For two dogs listed together, e.g. "Zeus & Star"
  - label: Listed together (a pair)
    name: pair
    widget: boolean
    default: false
    required: false
  - label: Status
    name: status
    widget: select
    options:
    - label: Available
      value: available
    - label: Adoption pending
      value: pending
    - label: Adopted
      value: adopted
    required: true
    default: available
  - label: Featured week
    name: featuredWeek
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    required: true
    hint: The week this pup is featured. The newest week gets a "New this week" ribbon.
  - label: Adopted on
    name: adoptedDate
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    required: false
    hint: Only when Status is Adopted
  - label: Urgent
    name: urgent
    widget: boolean
    default: false
    required: false
    hint: Shows an "Urgent" ribbon and moves the pup to the front
  - label: Looking for
    name: needs
    widget: select
    options:
    - label: Adopters
      value: adoption
    - label: A foster
      value: foster
    - label: Adopters or a foster
      value: both
    required: true
    default: adoption
  - label: Photos
    name: photos
    widget: list
    required: false
    hint: The first photo is the main one. Phone photos are resized automatically.
    field:
      label: Photo
      name: image
      widget: image
  - label: Photo description
    name: photoAlt
    widget: string
    required: false
    hint: For people using screen readers, e.g. "Luna, a tan pit mix, sitting in the grass"
  - label: One-line intro
    name: tagline
    widget: string
    required: false
  - label: Breed
    name: breed
    widget: string
    required: false
  - label: Age
    name: age
    widget: string
    required: false
    hint: e.g. "About 2 years"
  - label: Sex
    name: sex
    widget: string
    required: false
    hint: e.g. "Female"
  - label: Size
    name: size
    widget: select
    options:
    - Small
    - Medium
    - Large
    - Extra large
    required: false
  - label: Weight
    name: weight
    widget: string
    required: false
    hint: e.g. "45 lb"
  - label: Energy
    name: energy
    widget: select
    options:
    - Low
    - Medium
    - High
    required: false
  - label: Adoption fee
    name: fee
    widget: string
    required: false
    hint: e.g. "$150" or "Fee waived"
  - label: Personality
    name: personality
    widget: list
    required: false
    hint: Short words like "Cuddly", "Loves walks", "Shy at first"
  - label: Spayed or neutered
    name: fixed
    widget: select
    options: &id001
    - label: 'Yes'
      value: 'yes'
    - label: 'No'
      value: 'no'
    - label: Partly / some
      value: some
    - label: Not sure yet
      value: unknown
    required: true
    default: unknown
  - label: Spay/neuter note
    name: fixedNote
    widget: string
    required: false
  - label: Vaccines up to date
    name: vaccinated
    widget: select
    options: *id001
    required: true
    default: unknown
  - label: Microchipped
    name: microchipped
    widget: select
    options: *id001
    required: true
    default: unknown
  - label: Heartworm negative
    name: heartworm
    widget: select
    options: *id001
    required: true
    default: unknown
  - label: Medical notes
    name: medical
    widget: text
    required: false
  - label: Good with dogs
    name: goodWithDogs
    widget: select
    options: *id001
    required: true
    default: unknown
  - label: Good with cats
    name: goodWithCats
    widget: select
    options: *id001
    required: true
    default: unknown
  - label: Good with kids
    name: goodWithKids
    widget: select
    options: *id001
    required: true
    default: unknown
  - label: Gets-along note
    name: goodNote
    widget: string
    required: false
    hint: e.g. "Needs a home without cats"
  - label: Where the pup is
    name: location
    widget: object
    collapsed: false
    fields:
    - label: Type
      name: type
      widget: select
      options:
      - label: A rescue
        value: rescue
      - label: MDAS · Doral (Pet Adoption and Protection Center)
        value: mdas-doral
      - label: MDAS · Medley
        value: mdas-medley
      - label: Broward County Animal Care
        value: broward
      - label: A family rehoming
        value: family
      - label: In a foster home
        value: foster
      - label: Other
        value: other
      required: true
      default: rescue
    - label: Name of rescue or place
      name: name
      widget: string
      required: false
      hint: e.g. the rescue's name. Leave empty for shelters.
    - label: City / area
      name: city
      widget: string
      required: false
    - label: Shelter animal ID
      name: animalId
      widget: string
      required: false
      hint: e.g. A1234567
  - label: How to adopt / contact
    name: contact
    widget: object
    collapsed: false
    fields:
    - label: Instagram handle
      name: instagram
      widget: string
      required: false
      hint: Without the @
    - label: Website
      name: website
      widget: string
      required: false
    - label: Application link
      name: applyUrl
      widget: string
      required: false
    - label: Phone
      name: phone
      widget: string
      required: false
    - label: Email
      name: email
      widget: string
      required: false
    - label: Instructions
      name: instructions
      widget: text
      required: false
      hint: Optional. Leave empty to use the standard steps for this location.
  - label: Story
    name: body
    widget: markdown
    required: false
    buttons:
    - bold
    - italic
    - link
    - bulleted-list
    editor_components: []
- name: transactions
  label: 'Transparency: money in & out'
  label_singular: Ledger entry
  description: Every purchase or donation shown on the "Where the money goes" page. Upload receipts with card numbers, addresses and order IDs blacked out.
  folder: content/finances/entries
  extension: json
  format: json
  create: true
  delete: true
  identifier_field: description
  slug: '{{fields.date}}-{{slug}}'
  summary: '{{date}} · {{type}} · ${{amount}} · {{description}}'
  sortable_fields:
  - date
  - amount
  media_folder: /src/assets/finances/receipts
  public_folder: /assets/finances/receipts
  editor:
    preview: false
  fields:
  - label: Date
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    required: true
  - label: Money
    name: type
    widget: select
    options:
    - label: Spent (expense)
      value: expense
    - label: Received (income)
      value: income
    required: true
    default: expense
  - label: Category
    name: category
    widget: select
    options:
    - label: Spending · Food & supplies
      value: food-supplies
    - label: Spending · Spay & neuter
      value: vet-spay-neuter
    - label: Spending · Medical care
      value: vet-medical
    - label: Spending · Vaccines & microchips
      value: vaccines
    - label: Spending · Toys & enrichment
      value: toys-enrichment
    - label: Spending · Support for other rescues
      value: other-rescues
    - label: Spending · Transport
      value: transport
    - label: Spending · Boarding & foster support
      value: boarding-foster
    - label: Spending · Fees & admin
      value: fees-admin
    - label: Spending · Other
      value: other
    - label: Income · Donations
      value: donations
    - label: Income · Adoption fees
      value: adoption-fees
    - label: Income · Fundraisers
      value: fundraisers
    - label: Income · Grants
      value: grants
    - label: Income · Other income
      value: other-income
    required: true
  - label: What it was for
    name: description
    widget: string
    required: true
    hint: e.g. "Spay surgery for Luna"
  - label: Amount ($)
    name: amount
    widget: number
    value_type: float
    min: 0
    step: 0.01
  - label: Paid to / received from
    name: paid_to_or_from
    widget: string
    required: false
    hint: Business name. For donations, write "Individual donors" (never list donor names without permission).
  - label: Dog it helped
    name: dog
    widget: string
    required: false
  - label: Receipt
    name: receipt
    widget: file
    required: false
    hint: PDF or photo. Black out card numbers, addresses and order IDs first.
  - label: Notes
    name: notes
    widget: text
    required: false
- name: rescues
  label: Rescues you can help
  label_singular: Rescue
  description: Miami-Dade rescues and shelters people can support.
  folder: content/rescues
  create: true
  delete: true
  slug: '{{slug}}'
  identifier_field: name
  summary: '{{name}}'
  media_folder: /src/assets/img/rescues
  public_folder: /assets/img/rescues
  editor:
    preview: false
  fields:
  - label: Name
    name: name
    widget: string
    required: true
  - label: Order
    name: order
    widget: number
    required: false
    hint: Lower numbers show first
  - label: Instagram handle
    name: instagram
    widget: string
    required: false
    hint: Without the @
  - label: Website
    name: website
    widget: string
    required: false
  - label: Area / type
    name: area
    widget: string
    required: false
    hint: e.g. "Rescue · Homestead"
  - label: Short description
    name: summary
    widget: text
    required: false
  - label: What they need
    name: needs
    widget: select
    options:
    - label: Foster homes
      value: fosters
    - label: Adopters
      value: adopters
    - label: Volunteers
      value: volunteers
    - label: Supplies
      value: supplies
    - label: Donations
      value: donations
    - label: Transport
      value: transport
    - label: Shares on social
      value: sharing
    required: false
    multiple: true
  - label: Wishlist link
    name: wishlist
    widget: string
    required: false
  - label: Donation link
    name: donate
    widget: string
    required: false
  - label: Logo
    name: logo
    widget: image
    required: false
  - label: How to help
    name: body
    widget: markdown
    required: false
    buttons:
    - bold
    - italic
    - link
    - bulleted-list
    editor_components: []
- name: dogs
  label: Our dogs (Bentley's Playhouse)
  label_singular: Dog
  description: Dogs in Bentley's Playhouse's own care, shown on Adopt & Foster.
  folder: content/dogs
  create: true
  delete: true
  slug: '{{slug}}'
  identifier_field: name
  summary: '{{name}} · {{status}}'
  media_folder: /src/assets/img/dogs
  public_folder: /assets/img/dogs
  editor:
    preview: false
  fields:
  - label: Name
    name: name
    widget: string
    required: true
  - label: Whose dog
    name: source
    widget: select
    options:
    - label: Bentley's Playhouse
      value: bentleys
    - label: Partner rescue listing
      value: partner
    required: true
    default: bentleys
  - label: Partner rescue name
    name: partnerName
    widget: string
    required: false
  - label: Status
    name: status
    widget: select
    options:
    - label: Available
      value: available
    - label: Adoption pending
      value: pending
    - label: Adopted (hidden)
      value: adopted
    required: true
    default: available
  - label: Age
    name: age
    widget: string
    required: false
  - label: Sex
    name: sex
    widget: string
    required: false
  - label: Size
    name: size
    widget: string
    required: false
  - label: Good with
    name: goodWith
    widget: string
    required: false
  - label: Energy
    name: energy
    widget: string
    required: false
  - label: Medical notes
    name: medical
    widget: string
    required: false
  - label: Photo
    name: photo
    widget: image
    required: false
  - label: Photo description
    name: photoAlt
    widget: string
    required: false
  - label: Date listed
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    required: false
  - label: Application link for this dog
    name: inquiryUrl
    widget: string
    required: false
  - label: Summary
    name: summary
    widget: text
    required: false
  - label: About
    name: body
    widget: markdown
    required: false
    buttons:
    - bold
    - italic
    - link
    - bulleted-list
    editor_components: []
